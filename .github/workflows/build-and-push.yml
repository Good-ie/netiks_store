name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to deploy to production, e.g. v1.1.0'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  # ---------------------------------------------------------
  # JOB 1: VALIDATE
  # ---------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          touch .env
          docker compose -f docker-compose.yml config

      - name: Python Linting
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exit-zero

  # ---------------------------------------------------------
  # JOB 2: BUILD AND PUSH
  # ---------------------------------------------------------
  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - web
          - gateway
          - identity-service
          - vendor-service
          - catalog-service
          - media-service
          - admin-service
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::699475922919:role/github-actions-ecr-role
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Image
        run: |
          if [ "${{ matrix.service }}" == "web" ]; then
            DOCKERFILE="infra/docker/web.Dockerfile"
          elif [ "${{ matrix.service }}" == "gateway" ]; then
            DOCKERFILE="apps/gateway/Dockerfile"
          else
            DOCKERFILE="services/${{ matrix.service }}/Dockerfile"
          fi

          REPO=${{ steps.login-ecr.outputs.registry }}/netiks-store/${{ matrix.service }}
          GIT_SHA=${{ github.sha }}

          docker build --platform linux/amd64 -t $REPO:$GIT_SHA -f $DOCKERFILE .
          docker push $REPO:$GIT_SHA

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION_TAG=${GITHUB_REF#refs/tags/}
            docker tag $REPO:$GIT_SHA $REPO:$VERSION_TAG
            docker tag $REPO:$GIT_SHA $REPO:latest
            docker push $REPO:$VERSION_TAG
            docker push $REPO:latest
          fi

  # ---------------------------------------------------------
  # JOB 3: AUTOMATIC STAGING DEPLOYMENT (WEEK 6)
  # ---------------------------------------------------------
  deploy-staging:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy to staging over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            cd /home/deploy/netiks_store-staging

            git fetch origin main
            git checkout --force main
            git reset --hard origin/main

            export IMAGE_TAG="${{ github.sha }}"
            export REGISTRY="699475922919.dkr.ecr.us-east-1.amazonaws.com/netiks-store"

            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 699475922919.dkr.ecr.us-east-1.amazonaws.com

            docker compose \
              -p netiks_staging \
              -f docker-compose.yml \
              -f docker-compose.staging.yml \
              pull

            docker compose \
              -p netiks_staging \
              -f docker-compose.yml \
              -f docker-compose.staging.yml \
              up -d

            docker compose -p netiks_staging ps

  # ---------------------------------------------------------
  # JOB 4: PRODUCTION DEPLOYMENT WITH APPROVAL GATE
  # ---------------------------------------------------------
  deploy-production:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to production over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            cd /home/deploy/netiks_store

            VERSION="${{ inputs.version || github.ref_name }}"

            git fetch --tags origin
            git checkout --force "$VERSION"

            export IMAGE_TAG="$VERSION"
            export REGISTRY="699475922919.dkr.ecr.us-east-1.amazonaws.com/netiks-store"

            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 699475922919.dkr.ecr.us-east-1.amazonaws.com

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              pull

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d

            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps